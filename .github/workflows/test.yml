name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      peer_commit:
        description: "Reviewed EyrArcHy commit (full 40-character SHA); empty checks its default branch"
        type: string
        default: ""
      peer_reviewed:
        description: "I reviewed the exact peer commit above for this pair"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  HISTFILE: /dev/null

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base
      options: --init
    steps:
      - name: Prepare Arch userspace
        run: |
          pacman -Syu --noconfirm --needed git make jq lua python shellcheck stow fastfetch diffutils
          useradd --create-home --user-group --uid 1000 --shell /bin/bash ci
          install -d -o ci -g ci -m 700 /tmp/eyr-ci
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run unprivileged checks
        run: |
          chown --recursive --no-dereference ci:ci "$GITHUB_WORKSPACE"
          runuser -u ci -- env HOME=/home/ci TMPDIR=/tmp/eyr-ci \
            bash -euo pipefail <<'CHECK_REPO'
          test "$(id -u)" -ne 0
          make lint check
          CHECK_REPO
  twins:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base
      options: --init
    steps:
      - name: Prepare Arch userspace
        run: |
          pacman -Syu --noconfirm --needed git make
          useradd --create-home --user-group --uid 1000 --shell /bin/bash ci
          install -d -o ci -g ci -m 700 /tmp/eyr-ci
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Exact Twin Pair
        env:
          PEER_COMMIT: ${{ inputs.peer_commit }}
          PEER_REVIEWED: ${{ inputs.peer_reviewed }}
        run: |
          chown --recursive --no-dereference ci:ci "$GITHUB_WORKSPACE"
          runuser -u ci -- env HOME=/home/ci TMPDIR=/tmp/eyr-ci RUNNER_TEMP=/tmp/eyr-ci \
            bash -euo pipefail <<'CHECK_TWINS' | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(id -u)" -ne 0
          if [[ -n "$PEER_COMMIT" ]]; then
            [[ "$PEER_COMMIT" =~ ^[0-9a-f]{40}$ && "$PEER_REVIEWED" == true ]] || {
              echo 'FAIL: an explicit peer requires a full commit SHA and peer_reviewed=true'
              exit 1
            }
          fi
          # Read peer Git objects only. Never load its Makefile, scripts, or workflows.
          peer="$RUNNER_TEMP/eyrarchy"
          git init -q "$peer"
          git -C "$peer" fetch -q --no-tags --depth=1 https://github.com/peregrinus879/eyrarchy.git "${PEER_COMMIT:-HEAD}"
          actual=$(git -C "$peer" rev-parse 'FETCH_HEAD^{commit}')
          [[ -z "$PEER_COMMIT" || "$actual" == "$PEER_COMMIT" ]] || { echo 'FAIL: fetched peer is not the reviewed commit'; exit 1; }
          self=$(git rev-parse HEAD)
          printf 'Twin pair: eyrarchy %s, eyrwsl %s\n' "$actual" "$self"
          make twins-pair SELF_COMMIT="$self" PEER_COMMIT="$actual" SIBLING="$peer"
          CHECK_TWINS
