name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      peer_commit:
        description: "Reviewed EyrArcHy commit (full 40-character SHA); empty checks its default branch"
        type: string
        default: ""
      peer_reviewed:
        description: "I reviewed the exact peer commit above for this pair"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl git jq lua5.4 python3 stow tmux xz-utils
          command -v luac > /dev/null || sudo ln -s "$(command -v luac5.4)" /usr/local/bin/luac
          curl -fsSL -o "$RUNNER_TEMP/fastfetch.deb" https://github.com/fastfetch-cli/fastfetch/releases/latest/download/fastfetch-linux-amd64.deb
          sudo apt-get install -y "$RUNNER_TEMP/fastfetch.deb"
      - name: Install pinned ShellCheck
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          printf '%s  %s\n' '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198' "$RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP" shellcheck-v0.11.0/shellcheck
          "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" --version
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - run: make lint
      - run: make check
  twins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Exact Twin Pair
        env:
          PEER_COMMIT: ${{ inputs.peer_commit }}
          PEER_REVIEWED: ${{ inputs.peer_reviewed }}
        run: |
          set -euo pipefail
          if [[ -n "$PEER_COMMIT" ]]; then
            [[ "$PEER_COMMIT" =~ ^[0-9a-f]{40}$ && "$PEER_REVIEWED" == true ]] || {
              echo 'FAIL: an explicit peer requires a full commit SHA and peer_reviewed=true'
              exit 1
            }
          fi
          # Read peer Git objects only. Never load its Makefile, scripts, or workflows.
          peer="$RUNNER_TEMP/eyrarchy"
          git init -q "$peer"
          git -C "$peer" fetch -q --no-tags --depth=1 https://github.com/peregrinus879/eyrarchy.git "${PEER_COMMIT:-HEAD}"
          actual=$(git -C "$peer" rev-parse 'FETCH_HEAD^{commit}')
          [[ -z "$PEER_COMMIT" || "$actual" == "$PEER_COMMIT" ]] || { echo 'FAIL: fetched peer is not the reviewed commit'; exit 1; }
          self=$(git rev-parse HEAD)
          printf 'Twin pair: eyrarchy %s, eyrwsl %s\n' "$actual" "$self" >> "$GITHUB_STEP_SUMMARY"
          make twins-pair SELF_COMMIT="$self" PEER_COMMIT="$actual" SIBLING="$peer"
