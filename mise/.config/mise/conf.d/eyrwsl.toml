# Stowed by EyrWSL. Paranoid mode: every project-level mise config needs an
# explicit `mise trust`, hashed so an edit re-prompts; global configs, this
# fragment included, stay implicitly trusted. Tool pins live in config.toml,
# which the ~/.local/bin wrappers write with `mise use -g`. Upgrades keep the
# version a running client executes from, as Omarchy sets since 4.0.4, so
# `mise up` never prunes an install out from under a live session.
[settings]
paranoid = true
upgrade.auto_prune = false
